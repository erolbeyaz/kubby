# Kubby gitleaks configuration
[extend]
useDefault = true

[allowlist]
description = "Placeholders and deliberate test fixtures — never real secrets"

paths = [
  # Documentation placeholders.
  '''\.env\.example$''',
  '''docs/ARCHITECTURE\.md$''',

  # This file exists to prove the redaction layer catches secret-shaped strings, so it
  # necessarily contains fake JWTs, tokens and PEM blocks. Allowlisted by exact path
  # rather than by a "tests" pattern: a real secret must never be able to hide in a
  # test file elsewhere in the tree.
  '''server/internal/logging/redact_test\.go$''',
]

regexes = [
  '''CHANGE_ME[A-Z_0-9]*''',
  '''<from-secret>''',
  '''<base64-32-bytes>''',

  # The value seeded into the throwaway test cluster, and its base64 form. Tests assert
  # this string does NOT appear in resource listings, so it has to be written down to be
  # checked for. Allowlisted by exact value rather than by file, so a real secret in the
  # same test file is still caught.
  '''not-a-real-password-for-testing''',
  '''bm90LWEtcmVhbC1wYXNzd29yZC1mb3ItdGVzdGluZw==''',
]
