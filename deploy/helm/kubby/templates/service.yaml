apiVersion: v1
kind: Service
metadata:
  name: {{ include "kubby.fullname" . }}
  labels: {{- include "kubby.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    {{- range .Values.service.forwardPorts }}
    - port: {{ . }}
      targetPort: fwd-{{ . }}
      protocol: TCP
      name: fwd-{{ . }}
    {{- end }}
  selector: {{- include "kubby.selectorLabels" . | nindent 4 }}
