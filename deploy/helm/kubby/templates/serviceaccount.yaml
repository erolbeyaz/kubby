{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kubby.serviceAccountName" . }}
  labels: {{- include "kubby.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
# Only mounted when Kubby manages the cluster it runs in. Otherwise it reaches clusters
# with pasted kubeconfigs and has no use for a token of its own.
automountServiceAccountToken: {{ .Values.inCluster.enabled }}
{{- end }}
