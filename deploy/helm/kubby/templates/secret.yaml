{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
{{/*
For a first look only.

A key created here lives in Helm's release history, and `helm upgrade` regenerates it
unless it is passed in again — after which nothing sealed with the old one can be opened.
Real deployments create the Secret themselves and name it in secrets.existingSecret.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-secrets" (include "kubby.fullname" .) }}
  labels: {{- include "kubby.labels" . | nindent 4 }}
  annotations:
    kubby.io/warning: "generated by the chart; replace with a managed Secret before relying on it"
type: Opaque
stringData:
  {{ .Values.secrets.encryptionKeyKey }}: {{ required "secrets.encryptionKey is required when secrets.create is true" .Values.secrets.encryptionKey | quote }}
  {{ .Values.secrets.dbPasswordKey }}: {{ required "database password is required" .Values.secrets.dbPassword | quote }}
  {{- if .Values.config.metricsToken }}
  metrics-token: {{ .Values.config.metricsToken | quote }}
  {{- end }}
{{- end }}
