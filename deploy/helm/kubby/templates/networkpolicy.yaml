{{- if .Values.networkPolicy.enabled }}
{{/*
Off unless asked for, and it has to be told where things are.

A policy that is almost right is an outage: Kubby has to reach the API server of every
cluster it manages, and only the operator knows those addresses. Guessing them here would
produce a policy that looks complete and silently breaks half the fleet.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kubby.fullname" . }}
  labels: {{- include "kubby.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "kubby.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]

  ingress:
    {{- with .Values.networkPolicy.ingressFrom }}
    - from: {{- toYaml . | nindent 8 }}
      ports:
        - port: 8080
          protocol: TCP
    {{- else }}
    # Nothing named, so nothing reaches Kubby. Deliberately not "allow all": an empty
    # list here should fail closed and be noticed, not quietly permit everything.
    []
    {{- end }}

  egress:
    # DNS, or nothing resolves and every other rule is moot.
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- with .Values.networkPolicy.egressTo }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
