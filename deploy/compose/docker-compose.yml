# Kubby, as it is actually deployed.
#
# Two containers and nothing else: Kubby and its database. Elasticsearch, Loki and the
# rest are not here on purpose — they are somebody else's systems that Kubby is pointed
# at, not things it ships with. If you have them, configure the address from Kubby's own
# settings screen; if you do not, everything works without them.
#
#   cp .env.example .env      then edit it — the two required values are marked
#   docker compose up -d
#
# Nothing is built here. The image is pulled by tag, so upgrading is a tag change and a
# `docker compose up -d`, and rolling back is the same in reverse.

# Overridable so this can sit beside a development stack on the same machine without the
# two sharing containers and volumes. On a server, leave it.
name: ${COMPOSE_PROJECT_NAME:-kubby}

services:
  postgres:
    # Pinned by digest as well as tag: a tag can be moved, a digest cannot, and this
    # holds every credential Kubby stores.
    image: ${REGISTRY:-docker.io}/library/postgres:18.6@sha256:06cad38a5d9f5d24b4d83d86def30795d5e4b757fedbf5281172b576dedcd941
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KUBBY_DB_NAME:-kubby}
      POSTGRES_USER: ${KUBBY_DB_USER:-kubby}
      POSTGRES_PASSWORD: ${KUBBY_DB_PASSWORD:?set KUBBY_DB_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - kubby-db:/var/lib/postgresql
    # Deliberately not published. Nothing outside this compose project needs to reach the
    # database, and a port on the host is a port somebody can find.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KUBBY_DB_USER:-kubby} -d ${KUBBY_DB_NAME:-kubby}"]
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  kubby:
    image: ${KUBBY_IMAGE:?set KUBBY_IMAGE in .env}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: [.env]
    environment:
      # Fixed here rather than left to .env: postgres is the service name on this
      # network, and getting it wrong is the most common way a first start fails.
      KUBBY_DB_HOST: postgres
      KUBBY_DB_PORT: "5432"
      KUBBY_HTTP_ADDR: ":8080"
    ports:
      - "${KUBBY_HOST_PORT:-8080}:8080"

    # The image is distroless and runs as 65532 with no shell. These keep it that way.
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      # The cluster terminal writes a per-session kubeconfig and any files dropped into
      # it. In memory, so a read-only root filesystem stays read-only and nothing a
      # session wrote survives it.
      - /tmp:mode=1777,size=128m

    healthcheck:
      test: ["CMD", "/kubby", "-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  kubby-db:
