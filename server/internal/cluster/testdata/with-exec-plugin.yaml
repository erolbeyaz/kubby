apiVersion: v1
kind: Config
clusters:
- name: eks-cluster
  cluster:
    server: https://ABC123.gr7.eu-west-1.eks.amazonaws.com
users:
- name: eks-user
  user:
    exec:
      apiVersion: client.authentication.k8s.io/v1beta1
      command: aws
      args: ["eks", "get-token", "--cluster-name", "prod"]
contexts:
- name: eks
  context: {cluster: eks-cluster, user: eks-user}
current-context: eks
